[project]
name = "pltui"
version = "0.1.0"
description = "Pulumi Textual User Interface"
authors = [{ name = "Fabio Todaro", email = "fbregist@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "textual (>=6.3.0,<7.0.0)",
    "pydantic (>=2.12.2,<3.0.0)",
    "pulumi (>=3.203.0,<4.0.0)",
]

[dependency-groups]
dev = [
    "mypy (>=1.18.2,<2.0.0)",
    "textual-dev (>=1.8.0,<2.0.0)",
    "ruff (>=0.14.1,<0.15.0)",
]

[project.scripts]
pltui = 'pltui.__main__:main'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
